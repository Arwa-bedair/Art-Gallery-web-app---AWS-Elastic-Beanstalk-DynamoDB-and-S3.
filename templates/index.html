<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Gallery</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header>
    <h1>🎨 The Art Gallery</h1>
    <p>Click any painting to discover its story</p>
  </header>
  <main>
    <div class="gallery-grid">
      {% for painting in paintings %}
      <a href="/painting/{{ painting.id }}" class="painting-card">
        <div class="painting-image-wrapper">
          <img src="{{ painting.image_url }}" alt="{{ painting.title }}" loading="lazy">
        </div>
        <div class="painting-info">
          <h3>{{ painting.title }}</h3>
          <p>{{ painting.artist }}</p>
        </div>
      </a>
      {% endfor %}
    </div>
  </main>
</body>
</html>
